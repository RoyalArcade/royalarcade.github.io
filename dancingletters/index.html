<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ Dancing Letters Phonics Magic ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <!-- Confetti Engine for instant celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka One', cursive, sans-serif;
      background: linear-gradient(180deg, #81D4FA 0%, #B3E5FC 45%, #C8E6C9 45%, #81C784 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Floating Clouds Background */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50px;
      z-index: 0;
      animation: floatCloud 24s linear infinite;
    }
    @keyframes floatCloud {
      from { transform: translateX(-150px); }
      to { transform: translateX(110vw); }
    }

    header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2.2rem;
      color: #FF5722;
      text-shadow: 3px 3px 0 #FFF9C4, 5px 5px 0 rgba(0,0,0,0.1);
      letter-spacing: 1px;
    }

    .subtext {
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      color: #01579B;
    }

    /* Giant 1-Tap Word Preset Cards for Toddlers */
    .quick-shelf {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 100%;
      padding: 8px 4px 14px;
      scrollbar-width: none;
    }
    .quick-shelf::-webkit-scrollbar { display: none; }

    .magic-card {
      background: #FFFFFF;
      border: 4px solid #FFCA28;
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      box-shadow: 0 8px 0 #FFA000;
      transform: translateY(0);
      transition: transform 0.1s, box-shadow 0.1s;
      flex-shrink: 0;
    }
    .magic-card:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #FFA000;
    }
    .magic-card .emoji { font-size: 2.4rem; }
    .magic-card .label { font-size: 1.15rem; color: #E65100; }

    /* The Dancing Stage */
    .stage-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      background: #FFFDE7;
      border: 6px dashed #FFB300;
      border-radius: 30px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 10px 18px;
      box-shadow: 0 10px 0 rgba(0,0,0,0.12);
      margin-bottom: 12px;
    }

    .dance-floor {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 125px;
      transition: gap 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* When letters hold hands, they snap side by side */
    .dance-floor.holding-hands {
      gap: 2px !important;
    }

    /* Chunky Animated Letter Blocks */
    .block {
      width: 86px;
      height: 98px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      color: #FFFFFF;
      font-size: 3.2rem;
      box-shadow: 0 8px 0 rgba(0,0,0,0.22);
      transition: transform 0.15s;
    }
    .block:active {
      transform: scale(0.92) translateY(4px);
    }

    /* Animated Faces (Eyes & Talking Mouth) */
    .face {
      position: absolute;
      top: 10px;
      display: flex;
      gap: 16px;
    }
    .eye {
      width: 10px;
      height: 12px;
      background: #212121;
      border-radius: 50%;
      position: relative;
      animation: blink 3.5s infinite;
    }
    .eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3.5px;
      height: 3.5px;
      background: #FFF;
      border-radius: 50%;
    }
    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    .mouth {
      position: absolute;
      bottom: 10px;
      width: 16px;
      height: 7px;
      background: #212121;
      border-radius: 0 0 12px 12px;
      transition: height 0.15s;
    }
    .talking .mouth {
      height: 14px;
      border-radius: 50%;
    }

    .letter-glyph {
      margin-top: 4px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
    }

    /* Fun Movement Animations */
    .bounce-dance {
      animation: toddlerBounce 0.5s ease infinite alternate;
    }
    .shake-wiggle {
      animation: wiggle 0.4s ease infinite alternate;
    }
    @keyframes toddlerBounce {
      0% { transform: translateY(0) scale(1, 1); }
      100% { transform: translateY(-22px) scale(0.95, 1.05); }
    }
    @keyframes wiggle {
      0% { transform: rotate(-10deg) scale(1.08); }
      100% { transform: rotate(10deg) scale(1.08); }
    }

    /* Action Buttons */
    .stage-actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .big-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.25rem;
      padding: 12px 26px;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 7px 0 rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .big-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }
    .btn-hug { background: #FF4081; color: white; }
    .btn-clear { background: #78909C; color: white; }

    /* Baby Smash Keyboard (Tappable Letter Grid) */
    .alphabet-tray {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 14px;
      max-width: 620px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      box-shadow: 0 8px 0 rgba(0,0,0,0.1);
    }
    .tray-title {
      width: 100%;
      text-align: center;
      color: #2E7D32;
      font-size: 1.1rem;
      margin-bottom: 2px;
    }

    /* Giant Celebration Pop-up */
    .party-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 999;
    }
    .party-modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .party-card {
      background: #FFF;
      border: 8px solid #FFD54F;
      border-radius: 36px;
      padding: 30px;
      text-align: center;
      transform: scale(0.6);
      transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .party-modal.show .party-card { transform: scale(1); }
    .party-card .big-emoji { font-size: 6rem; animation: toddlerBounce 0.6s infinite alternate; }
    .party-card .big-word { font-size: 3.2rem; color: #D81B60; }
  </style>
</head>
<body>

  <!-- Floating Background Clouds -->
  <div class="cloud" style="top: 8%; width: 120px; height: 40px; animation-duration: 22s;"></div>
  <div class="cloud" style="top: 22%; width: 170px; height: 50px; animation-duration: 30s; animation-delay: -10s;"></div>

  <header>
    <h1>✨ Dancing Letters! ✨</h1>
    <div class="subtext">Tap letters, hear the sounds, hold hands to read!</div>
  </header>

  <!-- 1-Tap Preschool Preset Shelf -->
  <div class="quick-shelf">
    <div class="magic-card" onclick="quickPlayWord('C','A','T','🐱','meow')">
      <span class="emoji">🐱</span>
      <span class="label">CAT</span>
    </div>
    <div class="magic-card" onclick="quickPlayWord('D','O','G','🐶','bark')">
      <span class="emoji">🐶</span>
      <span class="label">DOG</span>
    </div>
    <div class="magic-card" onclick="quickPlayWord('S','U','N','☀️','sun')">
      <span class="emoji">☀️</span>
      <span class="label">SUN</span>
    </div>
    <div class="magic-card" onclick="quickPlayWord('P','I','G','🐷','oink')">
      <span class="emoji">🐷</span>
      <span class="label">PIG</span>
    </div>
    <div class="magic-card" onclick="quickPlayWord('C','A','R','🚗','beep')">
      <span class="emoji">🚗</span>
      <span class="label">CAR</span>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage-wrapper">
    <div class="dance-floor" id="danceFloor"></div>
    <div class="stage-actions">
      <button class="big-btn btn-hug" onclick="holdHandsAndBlend()">
        🤝 Hold Hands & Blend!
      </button>
      <button class="big-btn btn-clear" onclick="clearDanceFloor()">
        🔄 Clear
      </button>
    </div>
  </div>

  <!-- Letter Keyboard -->
  <div class="alphabet-tray">
    <div class="tray-title">👇 Tap Any Letter to Dance & Sing! 👇</div>
    <div id="alphabetBank" style="display:contents;"></div>
  </div>

  <!-- Reward Celebration Modal -->
  <div class="party-modal" id="partyModal" onclick="closeCelebration()">
    <div class="party-card">
      <div class="big-emoji" id="modalEmoji">🐱</div>
      <div class="big-word" id="modalWord">CAT</div>
      <p style="font-family:'Nunito'; font-size:1.2rem; color:#444;">Word Magic unlocked! ✨</p>
    </div>
  </div>

  <script>
    // Pure Phonics dictionary using natural respelling for Google TTS / Web Speech
    const phonicsData = {
      'A': { sound: 'ah', color: '#E53935' },
      'B': { sound: 'b', color: '#1E88E5' },
      'C': { sound: 'k', color: '#FDD835' },
      'D': { sound: 'd', color: '#FB8C00' },
      'E': { sound: 'eh', color: '#D81B60' },
      'F': { sound: 'fff', color: '#00ACC1' },
      'G': { sound: 'g', color: '#43A047' },
      'H': { sound: 'h', color: '#8E24AA' },
      'I': { sound: 'ih', color: '#3949AB' },
      'J': { sound: 'j', color: '#FFB300' },
      'K': { sound: 'k', color: '#F4511E' },
      'L': { sound: 'lll', color: '#00897B' },
      'M': { sound: 'mmm', color: '#C0CA33' },
      'N': { sound: 'nnn', color: '#6D4C41' },
      'O': { sound: 'aw', color: '#F4511E' },
      'P': { sound: 'p', color: '#E91E63' },
      'R': { sound: 'rrr', color: '#7CB342' },
      'S': { sound: 'sss', color: '#039BE5' },
      'T': { sound: 't', color: '#00B0FF' },
      'U': { sound: 'uh', color: '#8E24AA' },
      'W': { sound: 'w', color: '#00897B' },
      'Y': { sound: 'y', color: '#FFB300' },
      'Z': { sound: 'zzz', color: '#FFD600' }
    };

    const wordMagic = {
      'CAT': { emoji: '🐱', sound: 'meow' },
      'DOG': { emoji: '🐶', sound: 'bark' },
      'SUN': { emoji: '☀️', sound: 'chime' },
      'PIG': { emoji: '🐷', sound: 'oink' },
      'CAR': { emoji: '🚗', sound: 'beep' },
      'BAT': { emoji: '🦇', sound: 'chime' },
      'BED': { emoji: '🛏️', sound: 'chime' }
    };

    let activeLetters = [];
    const floor = document.getElementById('danceFloor');
    const bank = document.getElementById('alphabetBank');

    // Web Audio Synthesizer for instant toddler feedback
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playBoing() {
      playTone(280, 'triangle', 0.25);
    }

    function playAnimalSound(type) {
      if (type === 'meow') {
        playTone(600, 'sine', 0.35);
        setTimeout(() => playTone(820, 'sine', 0.4), 120);
      } else if (type === 'bark') {
        playTone(180, 'sawtooth', 0.15);
        setTimeout(() => playTone(160, 'sawtooth', 0.15), 180);
      } else if (type === 'beep') {
        playTone(440, 'triangle', 0.15);
        setTimeout(() => playTone(440, 'triangle', 0.2), 200);
      } else {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          setTimeout(() => playTone(f, 'sine', 0.28), i * 90);
        });
      }
    }

    // Google Pronunciation with resilient fallback
    function speakAudio(text, isPhoneme = false) {
      const cleanSound = isPhoneme ? (phonicsData[text]?.sound || text) : text;

      // Google Translate Voice Stream
      const googleUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(cleanSound)}`;
      const audio = new Audio(googleUrl);

      audio.play().catch(() => {
        // Fallback to high-clarity browser SpeechSynthesis
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanSound);
        utterance.pitch = 1.35;
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      });
    }

    // Create Chunky Block Element
    function makeBlock(char) {
      const div = document.createElement('div');
      div.className = 'block';
      div.style.backgroundColor = phonicsData[char].color;

      div.innerHTML = `
        <div class="face">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="letter-glyph">${char}</div>
        <div class="mouth"></div>
      `;
      return div;
    }

    // Populate Alphabet Bank
    Object.keys(phonicsData).forEach(char => {
      const b = makeBlock(char);
      b.onclick = () => {
        playBoing();
        animateBlockTalking(b);
        speakAudio(char, true);
        pushToStage(char);
      };
      bank.appendChild(b);
    });

    function pushToStage(char) {
      if (activeLetters.length >= 4) return;
      activeLetters.push(char);
      renderDanceFloor();
    }

    function renderDanceFloor() {
      floor.innerHTML = '';
      floor.classList.remove('holding-hands');

      activeLetters.forEach((char) => {
        const b = makeBlock(char);
        b.classList.add('bounce-dance');
        b.onclick = () => {
          animateBlockTalking(b);
          playBoing();
          speakAudio(char, true);
        };
        floor.appendChild(b);
      });
    }

    function animateBlockTalking(blockElement) {
      blockElement.classList.add('talking');
      setTimeout(() => blockElement.classList.remove('talking'), 600);
    }

    function clearDanceFloor() {
      activeLetters = [];
      floor.classList.remove('holding-hands');
      renderDanceFloor();
      playTone(220, 'sine', 0.15);
    }

    // 1-Tap Quick Word Automation
    function quickPlayWord(l1, l2, l3, emoji, soundType) {
      clearDanceFloor();
      const letters = [l1, l2, l3];

      letters.forEach((letter, i) => {
        setTimeout(() => {
          pushToStage(letter);
          playBoing();
          speakAudio(letter, true);
        }, i * 400);
      });

      // Automatically trigger Hold Hands after they land
      setTimeout(() => {
        holdHandsAndBlend(emoji, soundType);
      }, letters.length * 400 + 400);
    }

    // Step-by-Step Hold Hands and Blend
    function holdHandsAndBlend(customEmoji, customSound) {
      if (activeLetters.length < 2) return;

      const blocks = floor.querySelectorAll('.block');

      // 1. Each letter sings its sound sequentially
      activeLetters.forEach((char, idx) => {
        setTimeout(() => {
          if (blocks[idx]) {
            animateBlockTalking(blocks[idx]);
            blocks[idx].classList.add('bounce-dance');
            speakAudio(char, true);
            playTone(320 + idx * 80, 'triangle', 0.2);
          }
        }, idx * 650);
      });

      // 2. Letters slide together and hold hands!
      const slideDelay = activeLetters.length * 650;
      setTimeout(() => {
        floor.classList.add('holding-hands');
        blocks.forEach(b => b.classList.add('shake-wiggle'));
      }, slideDelay);

      // 3. Pronounce whole word & blast confetti!
      const word = activeLetters.join('');
      setTimeout(() => {
        speakAudio(word, false);

        const magic = wordMagic[word] || { emoji: customEmoji || '🌟', sound: customSound || 'chime' };
        playAnimalSound(magic.sound);

        // Confetti explosion
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });

        showCelebration(word, magic.emoji);
      }, slideDelay + 650);
    }

    function showCelebration(word, emoji) {
      document.getElementById('modalEmoji').innerText = emoji;
      document.getElementById('modalWord').innerText = word;
      setTimeout(() => {
        document.getElementById('partyModal').classList.add('show');
      }, 500);
    }

    function closeCelebration() {
      document.getElementById('partyModal').classList.remove('show');
    }
  </script>
</body>
</html>
