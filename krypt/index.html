<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Krypt: Tiny Samurai Sandbox</title>
<style>
  :root {
    --winter-sky: #6cb8f6;
    --forest-sky: #70d6ff;
    --volcano-sky: #ff6b4a;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', cursive, sans-serif;
  }
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* TOP HUD */
  #top-hud {
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 20;
  }
  .hud-pill {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border: 3px solid #fff;
    border-radius: 25px;
    padding: 6px 16px;
    font-size: 16px;
    font-weight: 900;
    color: #2d3436;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    pointer-events: auto;
  }
  .btn-switch-hero {
    background: linear-gradient(135deg, #2d3436, #000);
    color: #ffd700;
    border: 3px solid #ffd700;
    border-radius: 25px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    pointer-events: auto;
    transition: transform 0.1s;
  }
  .btn-switch-hero:active {
    transform: scale(0.92);
  }

  /* BLUEPRINT BUILD SHELF */
  #build-shelf {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.9);
    border: 3px solid #fff;
    border-radius: 24px;
    padding: 6px 12px;
    display: flex;
    gap: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    z-index: 20;
    pointer-events: auto;
  }
  .blueprint-btn {
    background: #f1f2f6;
    border: 3px solid #dfe4ea;
    border-radius: 16px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .blueprint-btn.active {
    background: #ffeaa7;
    border-color: #ff9f43;
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 4px 12px rgba(255, 159, 67, 0.4);
  }
  .blueprint-icon {
    font-size: 26px;
  }
  .blueprint-name {
    font-size: 10px;
    font-weight: 900;
    color: #2f3542;
    margin-top: 2px;
  }

  /* GIANT TOUCH CONTROLS FOR 3-YEAR OLDS */
  .control-cluster {
    position: absolute;
    bottom: 20px;
    display: flex;
    gap: 16px;
    z-index: 25;
    pointer-events: auto;
  }
  #left-controls {
    left: 20px;
  }
  #right-controls {
    right: 20px;
  }
  .big-btn {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 4px solid #fff;
    font-size: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .big-btn:active, .big-btn.pressed {
    transform: translateY(6px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  #btn-left  { background: linear-gradient(135deg, #74b9ff, #0984e3); }
  #btn-right { background: linear-gradient(135deg, #55efc4, #00b894); }
  #btn-jump  { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); font-size: 36px; }
  #btn-slash { background: linear-gradient(135deg, #ff7675, #d63031); font-size: 34px; }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <!-- Top HUD -->
  <div id="top-hud">
    <div class="hud-pill" id="biome-pill">
      <span id="biome-emoji">🌲</span>
      <span id="biome-name">KRYPT: FOREST</span>
    </div>

    <button class="btn-switch-hero" id="btn-hero">
      HERO: <span id="hero-name">🐢 TURTLE</span>
    </button>
  </div>

  <!-- Magic Blueprint Instant Structure Shelf -->
  <div id="build-shelf">
    <div class="blueprint-btn active" data-type="block">
      <span class="blueprint-icon">🧱</span>
      <span class="blueprint-name">1 BLOCK</span>
    </div>
    <div class="blueprint-btn" data-type="castle">
      <span class="blueprint-icon">🏰</span>
      <span class="blueprint-name">CASTLE</span>
    </div>
    <div class="blueprint-btn" data-type="cabin">
      <span class="blueprint-icon">🛖</span>
      <span class="blueprint-name">CABIN</span>
    </div>
    <div class="blueprint-btn" data-type="igloo">
      <span class="blueprint-icon">🧊</span>
      <span class="blueprint-name">IGLOO</span>
    </div>
    <div class="blueprint-btn" data-type="shrine">
      <span class="blueprint-icon">⛩️</span>
      <span class="blueprint-name">SHRINE</span>
    </div>
  </div>

  <!-- Giant Touch Buttons -->
  <div class="control-cluster" id="left-controls">
    <div class="big-btn" id="btn-left">⬅️</div>
    <div class="big-btn" id="btn-right">➡️</div>
  </div>
  <div class="control-cluster" id="right-controls">
    <div class="big-btn" id="btn-slash">⚔️</div>
    <div class="big-btn" id="btn-jump">🦘</div>
  </div>
</div>

<script>
/**
 * KRYPT: 2D TERRARIA-STYLE ADVENTURE FOR 3-YEAR-OLDS
 * Pure Web Audio API + HTML5 Canvas
 */

// --- TODDLER WEB AUDIO SYNTHESIZER ---
class SoundFX {
  constructor() {
    this.ctx = null;
    this.currentBiome = 'forest';
    this.lastChime = 0;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playJump() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.17);
  }
  playSlash() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    // Whoosh
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);

    // Samurai Chime
    const chime = this.ctx.createOscillator();
    const chimeGain = this.ctx.createGain();
    chime.type = 'sine';
    chime.frequency.setValueAtTime(1046.5, now + 0.04); // C6
    chimeGain.gain.setValueAtTime(0.2, now + 0.04);
    chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    chime.connect(chimeGain);
    chimeGain.connect(this.ctx.destination);
    chime.start(now + 0.04);
    chime.stop(now + 0.23);
  }
  playBuildPoof() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.06);
      gain.gain.setValueAtTime(0.22, now + i * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.06);
      osc.stop(now + i * 0.06 + 0.19);
    });
  }
  playLavaBounce() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.linearRampToValueAtTime(480, now + 0.25);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.26);
  }
  ambientCheck(biome, time) {
    if (!this.ctx || time - this.lastChime < 3500) return;
    this.lastChime = time;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    if (biome === 'winter') {
      // Crystal Wind Chime
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1318.5, now); // E6
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    } else if (biome === 'volcano') {
      // Warm bubbling rumble
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.linearRampToValueAtTime(90, now + 0.6);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    } else {
      // Forest bird pip
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1174.6, now + 0.15);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    }
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.85);
  }
}
const sfx = new SoundFX();

// --- WORLD GRID CONSTANTS ---
const TILE_SIZE = 36;
const WORLD_COLS = 80; // Small cozy world "Krypt"
const WORLD_ROWS = 36;
const GROUND_LEVEL = 20;

// Tile Types
const T_AIR = 0;
const T_SNOW = 1;
const T_ICE = 2;
const T_GRASS = 3;
const T_DIRT = 4;
const T_WOOD = 5;
const T_LEAVES = 6;
const T_OBSIDIAN = 7;
const T_MAGMA = 8;
const T_LAVA = 9;
const T_CASTLE = 10;
const T_SHRINE = 11;

// World Map Array
let world = [];
for (let r = 0; r < WORLD_ROWS; r++) {
  world[r] = new Uint8Array(WORLD_COLS);
}

// Generate the 3 Biomes in Krypt:
// 0..25: Winter Realm | 26..53: Forest Realm | 54..79: Volcano Realm
function generateWorld() {
  for (let c = 0; c < WORLD_COLS; c++) {
    const isWinter = c < 26;
    const isForest = c >= 26 && c < 54;
    const isVolcano = c >= 54;

    // Gentle terrain rolling height
    let surfaceY = GROUND_LEVEL;
    if (isWinter) surfaceY = GROUND_LEVEL - Math.round(Math.sin(c * 0.4) * 2);
    if (isForest) surfaceY = GROUND_LEVEL + Math.round(Math.sin(c * 0.3) * 1);
    if (isVolcano) surfaceY = GROUND_LEVEL - Math.round(Math.cos(c * 0.35) * 3);

    for (let r = 0; r < WORLD_ROWS; r++) {
      if (r < surfaceY) {
        world[r][c] = T_AIR;
      } else if (r === surfaceY) {
        if (isWinter) world[r][c] = T_SNOW;
        else if (isForest) world[r][c] = T_GRASS;
        else world[r][c] = T_OBSIDIAN;
      } else if (r <= surfaceY + 3) {
        if (isWinter) world[r][c] = T_ICE;
        else if (isForest) world[r][c] = T_DIRT;
        else world[r][c] = T_MAGMA;
      } else {
        if (isVolcano && r >= WORLD_ROWS - 4 && c > 62 && c < 72) {
          world[r][c] = T_LAVA; // Safe Bouncy Lava Pool
        } else if (isWinter) {
          world[r][c] = T_ICE;
        } else if (isForest) {
          world[r][c] = T_DIRT;
        } else {
          world[r][c] = T_OBSIDIAN;
        }
      }
    }
  }

  // Pre-seed some trees and natural decorations
  buildTree(34, GROUND_LEVEL);
  buildTree(44, GROUND_LEVEL);
  buildPineTree(10, GROUND_LEVEL);
  buildPineTree(18, GROUND_LEVEL);
}

function buildTree(col, groundY) {
  for (let y = groundY - 4; y < groundY; y++) world[y][col] = T_WOOD;
  for (let y = groundY - 7; y < groundY - 3; y++) {
    for (let x = col - 2; x <= col + 2; x++) {
      if (world[y] && world[y][x] === T_AIR) world[y][x] = T_LEAVES;
    }
  }
}

function buildPineTree(col, groundY) {
  for (let y = groundY - 3; y < groundY; y++) world[y][col] = T_WOOD;
  for (let y = groundY - 6; y < groundY - 2; y++) {
    const width = (groundY - 2) - y;
    for (let x = col - width; x <= col + width; x++) {
      if (world[y] && world[y][x] === T_AIR) world[y][x] = T_SNOW;
    }
  }
}

generateWorld();

// --- PLAYER STATE ---
let heroType = 'turtle'; // 'turtle' or 'monkey'
let player = {
  x: 38 * TILE_SIZE, // Start in Forest Realm
  y: (GROUND_LEVEL - 4) * TILE_SIZE,
  vx: 0,
  vy: 0,
  w: 32,
  h: 36,
  facing: 1, // 1: right, -1: left
  grounded: false,
  slashing: false,
  slashTimer: 0,
  walkCycle: 0
};

// Input State
const keys = { left: false, right: false, jump: false, slash: false };

// --- BLUEPRINT STAMP SYSTEM ---
let selectedBlueprint = 'block';

const BLUEPRINTS = {
  block: {
    w: 1, h: 1,
    tiles: [[T_WOOD]]
  },
  castle: {
    w: 5, h: 5,
    tiles: [
      [T_CASTLE, T_AIR, T_AIR, T_AIR, T_CASTLE],
      [T_CASTLE, T_CASTLE, T_CASTLE, T_CASTLE, T_CASTLE],
      [T_CASTLE, T_AIR, T_AIR, T_AIR, T_CASTLE],
      [T_CASTLE, T_AIR, T_AIR, T_AIR, T_CASTLE],
      [T_CASTLE, T_CASTLE, T_AIR, T_CASTLE, T_CASTLE]
    ]
  },
  cabin: {
    w: 5, h: 4,
    tiles: [
      [T_AIR, T_LEAVES, T_LEAVES, T_LEAVES, T_AIR],
      [T_LEAVES, T_WOOD, T_WOOD, T_WOOD, T_LEAVES],
      [T_WOOD, T_AIR, T_AIR, T_AIR, T_WOOD],
      [T_WOOD, T_AIR, T_AIR, T_AIR, T_WOOD]
    ]
  },
  igloo: {
    w: 5, h: 3,
    tiles: [
      [T_AIR, T_SNOW, T_SNOW, T_SNOW, T_AIR],
      [T_SNOW, T_ICE, T_ICE, T_ICE, T_SNOW],
      [T_SNOW, T_AIR, T_AIR, T_AIR, T_SNOW]
    ]
  },
  shrine: {
    w: 5, h: 4,
    tiles: [
      [T_SHRINE, T_SHRINE, T_SHRINE, T_SHRINE, T_SHRINE],
      [T_AIR, T_SHRINE, T_AIR, T_SHRINE, T_AIR],
      [T_AIR, T_SHRINE, T_AIR, T_SHRINE, T_AIR],
      [T_AIR, T_SHRINE, T_AIR, T_SHRINE, T_AIR]
    ]
  }
};

// Particles (Snowflakes, Leaves, Embers, Sparkles)
let particles = [];
class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.life = 1.0;
    if (type === 'snow') {
      this.vx = (Math.random() - 0.5) * 1;
      this.vy = Math.random() * 1.5 + 0.8;
      this.size = Math.random() * 3 + 2;
      this.decay = 0.008;
    } else if (type === 'leaf') {
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = Math.random() * 1 + 0.5;
      this.size = Math.random() * 4 + 3;
      this.decay = 0.01;
    } else if (type === 'ember') {
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = -(Math.random() * 1.8 + 0.8);
      this.size = Math.random() * 3 + 2;
      this.decay = 0.015;
    } else { // 'star' slash / build burst
      const a = Math.random() * Math.PI * 2;
      const spd = Math.random() * 5 + 2;
      this.vx = Math.cos(a) * spd;
      this.vy = Math.sin(a) * spd;
      this.size = Math.random() * 6 + 4;
      this.decay = 0.035;
      this.color = ['#ffd700', '#ff6b6b', '#48dbfb', '#1dd1a1'][Math.floor(Math.random() * 4)];
    }
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    if (this.type === 'snow') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'leaf') {
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, this.size, this.size * 0.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'ember') {
      ctx.fillStyle = '#ff7f50';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ff4757';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.font = `${this.size * 2}px sans-serif`;
      ctx.fillText('⭐', this.x, this.y);
    }
    ctx.restore();
  }
}

// Spawns Ambient Weather According to Player's Biome
function spawnWeather(camX, camW) {
  const playerCol = Math.floor(player.x / TILE_SIZE);
  if (playerCol < 26 && Math.random() < 0.4) {
    particles.push(new Particle(camX + Math.random() * camW, player.y - 300, 'snow'));
  } else if (playerCol >= 26 && playerCol < 54 && Math.random() < 0.25) {
    particles.push(new Particle(camX + Math.random() * camW, player.y - 250, 'leaf'));
  } else if (playerCol >= 54 && Math.random() < 0.4) {
    particles.push(new Particle(camX + Math.random() * camW, player.y + 150, 'ember'));
  }
}

// --- CANVAS & RENDERING SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let viewW = window.innerWidth;
let viewH = window.innerHeight;

function resize() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = viewW;
  canvas.height = viewH;
}
window.addEventListener('resize', resize);
resize();

// --- COLLISION LOGIC ---
function isSolid(tile) {
  return tile !== T_AIR && tile !== T_LAVA;
}

function updatePhysics() {
  // Movement & Gravity
  const speed = 4.2;
  const jumpForce = -12.5;
  const gravity = 0.55;

  if (keys.left) {
    player.vx = -speed;
    player.facing = -1;
    player.walkCycle += 0.2;
  } else if (keys.right) {
    player.vx = speed;
    player.facing = 1;
    player.walkCycle += 0.2;
  } else {
    player.vx *= 0.6;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  // Jump
  if (keys.jump && player.grounded) {
    player.vy = jumpForce;
    player.grounded = false;
    sfx.playJump();
    for (let i = 0; i < 5; i++) {
      particles.push(new Particle(player.x + 16, player.y + 36, 'star'));
    }
  }

  // Apply Gravity
  player.vy += gravity;
  if (player.vy > 14) player.vy = 14;

  // Horizontal Movement & Collisions
  player.x += player.vx;
  // Boundary clamp
  if (player.x < 0) player.x = 0;
  if (player.x > (WORLD_COLS - 2) * TILE_SIZE) player.x = (WORLD_COLS - 2) * TILE_SIZE;

  let leftCol = Math.floor(player.x / TILE_SIZE);
  let rightCol = Math.floor((player.x + player.w) / TILE_SIZE);
  let topRow = Math.floor(player.y / TILE_SIZE);
  let bottomRow = Math.floor((player.y + player.h - 1) / TILE_SIZE);

  for (let r = topRow; r <= bottomRow; r++) {
    for (let c = leftCol; c <= rightCol; c++) {
      if (r >= 0 && r < WORLD_ROWS && c >= 0 && c < WORLD_COLS) {
        if (isSolid(world[r][c])) {
          if (player.vx > 0) player.x = c * TILE_SIZE - player.w - 0.1;
          else if (player.vx < 0) player.x = (c + 1) * TILE_SIZE + 0.1;
        }
      }
    }
  }

  // Vertical Movement & Collisions
  player.y += player.vy;
  leftCol = Math.floor(player.x / TILE_SIZE);
  rightCol = Math.floor((player.x + player.w) / TILE_SIZE);
  topRow = Math.floor(player.y / TILE_SIZE);
  bottomRow = Math.floor((player.y + player.h) / TILE_SIZE);

  player.grounded = false;

  for (let r = topRow; r <= bottomRow; r++) {
    for (let c = leftCol; c <= rightCol; c++) {
      if (r >= 0 && r < WORLD_ROWS && c >= 0 && c < WORLD_COLS) {
        const tile = world[r][c];

        // Safe Bouncy Lava Trampoline
        if (tile === T_LAVA) {
          player.vy = -16; // Huge joyful bounce
          sfx.playLavaBounce();
          for (let p = 0; p < 8; p++) particles.push(new Particle(player.x + 16, player.y + 36, 'ember'));
        } else if (isSolid(tile)) {
          if (player.vy > 0) {
            player.y = r * TILE_SIZE - player.h;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0) {
            player.y = (r + 1) * TILE_SIZE;
            player.vy = 0;
          }
        }
      }
    }
  }

  // Samurai Slash Logic
  if (player.slashing) {
    player.slashTimer += 0.18;
    if (player.slashTimer >= Math.PI) {
      player.slashing = false;
      player.slashTimer = 0;
    }
  }
}

// Action: Samurai Strike (Bursts nearby blocks/bushes into stars)
function triggerSlash() {
  sfx.init();
  if (player.slashing) return;
  player.slashing = true;
  player.slashTimer = 0;
  sfx.playSlash();

  // Hitbox in front of character
  const targetCol = Math.floor((player.x + (player.facing === 1 ? player.w + 18 : -18)) / TILE_SIZE);
  const targetRow = Math.floor((player.y + player.h * 0.5) / TILE_SIZE);

  if (targetRow >= 0 && targetRow < WORLD_ROWS && targetCol >= 0 && targetCol < WORLD_COLS) {
    const tile = world[targetRow][targetCol];
    // Break leaves, snow, shrine decorations with stars
    if (tile !== T_AIR && tile !== T_LAVA) {
      world[targetRow][targetCol] = T_AIR;
      for (let i = 0; i < 8; i++) {
        particles.push(new Particle(targetCol * TILE_SIZE + 18, targetRow * TILE_SIZE + 18, 'star'));
      }
    }
  }
}

// Action: Stamp Instant Blueprint
function stampStructure(tapWorldX, tapWorldY) {
  sfx.init();
  const baseCol = Math.floor(tapWorldX / TILE_SIZE);
  const baseRow = Math.floor(tapWorldY / TILE_SIZE);

  const bp = BLUEPRINTS[selectedBlueprint];
  if (!bp) return;

  const startCol = baseCol - Math.floor(bp.w / 2);
  const startRow = baseRow - bp.h + 1;

  for (let r = 0; r < bp.h; r++) {
    for (let c = 0; c < bp.w; c++) {
      const wR = startRow + r;
      const wC = startCol + c;
      if (wR >= 0 && wR < WORLD_ROWS && wC >= 0 && wC < WORLD_COLS) {
        const placeTile = bp.tiles[r][c];
        if (placeTile !== T_AIR) {
          world[wR][wC] = placeTile;
          particles.push(new Particle(wC * TILE_SIZE + 18, wR * TILE_SIZE + 18, 'star'));
        }
      }
    }
  }
  sfx.playBuildPoof();
}

// --- DRAWING CHARACTERS (Black Samurai Turtle & Monkey) ---
function drawPlayer(c, px, py) {
  c.save();
  c.translate(px + player.w / 2, py + player.h / 2);
  c.scale(player.facing, 1);

  const bob = Math.sin(player.walkCycle) * 3;

  if (heroType === 'turtle') {
    // === BLACK SAMURAI TURTLE ===
    // Black Shell with Gold Trim
    c.fillStyle = '#1e272e';
    c.beginPath();
    c.ellipse(-6, bob, 15, 17, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#ffd700';
    c.lineWidth = 2.5;
    c.stroke();

    // Turtle Green/Dark Head
    c.fillStyle = '#2f3542';
    c.beginPath();
    c.arc(10, -4 + bob, 9, 0, Math.PI * 2);
    c.fill();

    // Samurai Red Bandana Headband
    c.fillStyle = '#ff4757';
    c.fillRect(3, -11 + bob, 14, 4);
    // Bandana Ribbon Tail (fluttering)
    c.beginPath();
    c.moveTo(3, -9 + bob);
    c.lineTo(-8, -12 + bob + Math.sin(Date.now() * 0.01) * 3);
    c.lineTo(-6, -6 + bob);
    c.closePath();
    c.fill();

    // Cute Big Eyes
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(12, -5 + bob, 3.5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#000000';
    c.beginPath();
    c.arc(13, -5 + bob, 1.8, 0, Math.PI * 2);
    c.fill();

    // Turtle Feet
    c.fillStyle = '#2f3542';
    c.beginPath();
    c.arc(6, 16, 4.5, 0, Math.PI * 2);
    c.arc(-8, 16, 4.5, 0, Math.PI * 2);
    c.fill();

  } else {
    // === BLACK SAMURAI MONKEY ===
    // Black Fur Body
    c.fillStyle = '#2d3436';
    c.beginPath();
    c.ellipse(0, 4 + bob, 12, 14, 0, 0, Math.PI * 2);
    c.fill();

    // Monkey Tail
    c.strokeStyle = '#2d3436';
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(-10, 8 + bob);
    c.quadraticCurveTo(-22, -4, -14, -14 + Math.sin(Date.now() * 0.01) * 4);
    c.stroke();

    // Monkey Face
    c.fillStyle = '#636e72';
    c.beginPath();
    c.arc(8, -4 + bob, 9, 0, Math.PI * 2);
    c.fill();

    // Red Samurai Headband
    c.fillStyle = '#ff4757';
    c.fillRect(1, -11 + bob, 14, 4);

    // Cute Eyes
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(10, -5 + bob, 3, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#000000';
    c.beginPath();
    c.arc(11, -5 + bob, 1.5, 0, Math.PI * 2);
    c.fill();
  }

  // Bamboo / Toy Katana Sword
  c.save();
  c.translate(8, 4 + bob);
  if (player.slashing) {
    c.rotate(Math.sin(player.slashTimer) * 2.2);
  } else {
    c.rotate(0.4);
  }
  // Wooden Hilt
  c.fillStyle = '#b71540';
  c.fillRect(-2, -3, 4, 7);
  // Katana Blade
  c.fillStyle = '#dfe4ea';
  c.fillRect(-1.5, -24, 3, 21);
  // Blade tip
  c.beginPath();
  c.moveTo(-1.5, -24);
  c.lineTo(0, -28);
  c.lineTo(1.5, -24);
  c.closePath();
  c.fill();
  c.restore();

  // Radiant Slash Swoosh Arc
  if (player.slashing) {
    c.strokeStyle = 'rgba(255, 234, 167, 0.85)';
    c.lineWidth = 6;
    c.beginPath();
    c.arc(12, 0, 36, -0.8, 1.2);
    c.stroke();
  }

  c.restore();
}

// --- WORLD RENDERER ---
function drawWorld(camX, camY) {
  const startCol = Math.max(0, Math.floor(camX / TILE_SIZE));
  const endCol = Math.min(WORLD_COLS - 1, Math.ceil((camX + viewW) / TILE_SIZE));
  const startRow = Math.max(0, Math.floor(camY / TILE_SIZE));
  const endRow = Math.min(WORLD_ROWS - 1, Math.ceil((camY + viewH) / TILE_SIZE));

  for (let r = startRow; r <= endRow; r++) {
    for (let c = startCol; c <= endCol; c++) {
      const tile = world[r][c];
      if (tile === T_AIR) continue;

      const screenX = c * TILE_SIZE - camX;
      const screenY = r * TILE_SIZE - camY;

      // Color Palette by Tile
      switch (tile) {
        case T_SNOW:
          ctx.fillStyle = '#f1f2f6';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#dfe4ea';
          ctx.fillRect(screenX, screenY + TILE_SIZE - 6, TILE_SIZE, 6);
          break;
        case T_ICE:
          ctx.fillStyle = '#74b9ff';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.fillRect(screenX + 4, screenY + 4, TILE_SIZE - 8, 4);
          break;
        case T_GRASS:
          ctx.fillStyle = '#2ed573';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#7bed9f';
          ctx.fillRect(screenX, screenY, TILE_SIZE, 6); // Bright grassy top
          break;
        case T_DIRT:
          ctx.fillStyle = '#8b572a';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#704214';
          ctx.fillRect(screenX + 4, screenY + 6, 6, 6);
          break;
        case T_WOOD:
          ctx.fillStyle = '#a0522d';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = '#6e3519';
          ctx.lineWidth = 2;
          ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          break;
        case T_LEAVES:
          ctx.fillStyle = '#26de81';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#20bf6b';
          ctx.fillRect(screenX + 6, screenY + 6, TILE_SIZE - 12, TILE_SIZE - 12);
          break;
        case T_OBSIDIAN:
          ctx.fillStyle = '#2f3542';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#57606f';
          ctx.fillRect(screenX + 4, screenY + 4, 8, 8);
          break;
        case T_MAGMA:
          ctx.fillStyle = '#eb4d4b';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#ff7979';
          ctx.fillRect(screenX + 6, screenY + 6, TILE_SIZE - 12, TILE_SIZE - 12);
          break;
        case T_LAVA: // Toddler Bouncy Trampoline Lava
          ctx.fillStyle = '#ff4757';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#ffa502';
          ctx.fillRect(screenX, screenY + Math.sin(Date.now() * 0.008 + c) * 4, TILE_SIZE, 8);
          break;
        case T_CASTLE:
          ctx.fillStyle = '#747d8c';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = '#ced6e0';
          ctx.lineWidth = 2;
          ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          break;
        case T_SHRINE:
          ctx.fillStyle = '#eb2f06'; // Red Torii wood
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#1e272e';
          ctx.fillRect(screenX, screenY, TILE_SIZE, 5);
          break;
      }
    }
  }
}

// --- MAIN GAME LOOP ---
function gameLoop(time) {
  updatePhysics();

  // Smooth Camera Centered on Player
  const camX = Math.max(0, Math.min((WORLD_COLS * TILE_SIZE) - viewW, player.x - viewW / 2 + player.w / 2));
  const camY = Math.max(0, Math.min((WORLD_ROWS * TILE_SIZE) - viewH, player.y - viewH / 2 + player.h / 2));

  // Determine Current Biome
  const playerCol = Math.floor(player.x / TILE_SIZE);
  let activeBiome = 'forest';
  let skyColor1 = '#70d6ff';
  let skyColor2 = '#e0f7fa';

  if (playerCol < 26) {
    activeBiome = 'winter';
    skyColor1 = '#6cb8f6';
    skyColor2 = '#dff9fb';
  } else if (playerCol >= 54) {
    activeBiome = 'volcano';
    skyColor1 = '#ff6b4a';
    skyColor2 = '#ffbe76';
  }

  // Update Biome Indicator HUD
  const pill = document.getElementById('biome-pill');
  const emoji = document.getElementById('biome-emoji');
  const name = document.getElementById('biome-name');
  if (activeBiome === 'winter') {
    emoji.textContent = '❄️';
    name.textContent = 'KRYPT: WINTER';
  } else if (activeBiome === 'volcano') {
    emoji.textContent = '🌋';
    name.textContent = 'KRYPT: VOLCANO';
  } else {
    emoji.textContent = '🌲';
    name.textContent = 'KRYPT: FOREST';
  }

  // Biome Audio Checks
  sfx.ambientCheck(activeBiome, time);

  // Clear Sky Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, viewH);
  grad.addColorStop(0, skyColor1);
  grad.addColorStop(1, skyColor2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, viewW, viewH);

  // Parallax Clouds & Distant Mountains
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.arc(viewW * 0.25 - (camX * 0.08), 120, 60, 0, Math.PI * 2);
  ctx.arc(viewW * 0.32 - (camX * 0.08), 100, 75, 0, Math.PI * 2);
  ctx.arc(viewW * 0.75 - (camX * 0.08), 140, 65, 0, Math.PI * 2);
  ctx.fill();

  // Draw World Tiles
  drawWorld(camX, camY);

  // Draw Particles (Falling Snow, Leaves, Embers)
  spawnWeather(camX, viewW);
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Player Character
  drawPlayer(ctx, player.x - camX, player.y - camY);

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// --- INPUT LISTENERS (TOUCH & KEYBOARD) ---
// Button Binders
function bindButton(id, keyName) {
  const el = document.getElementById(id);
  const press = (e) => {
    e.preventDefault();
    sfx.init();
    keys[keyName] = true;
    el.classList.add('pressed');
  };
  const release = (e) => {
    e.preventDefault();
    keys[keyName] = false;
    el.classList.remove('pressed');
  };

  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}

bindButton('btn-left', 'left');
bindButton('btn-right', 'right');
bindButton('btn-jump', 'jump');

// Slash Action
document.getElementById('btn-slash').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  triggerSlash();
});

// Canvas Tap $\rightarrow$ Stamp Instant Blueprint or Place Block
canvas.addEventListener('pointerdown', (e) => {
  // Ignore taps on UI elements
  if (e.clientY < 130 || e.clientY > viewH - 120) return;
  const camX = Math.max(0, Math.min((WORLD_COLS * TILE_SIZE) - viewW, player.x - viewW / 2 + player.w / 2));
  const camY = Math.max(0, Math.min((WORLD_ROWS * TILE_SIZE) - viewH, player.y - viewH / 2 + player.h / 2));
  stampStructure(e.clientX + camX, e.clientY + camY);
});

// Switch Hero Button (Turtle $\leftrightarrow$ Monkey)
document.getElementById('btn-hero').addEventListener('click', () => {
  heroType = heroType === 'turtle' ? 'monkey' : 'turtle';
  document.getElementById('hero-name').textContent = heroType === 'turtle' ? '🐢 TURTLE' : '🐵 MONKEY';
  sfx.playJump();
  for (let i = 0; i < 8; i++) particles.push(new Particle(player.x + 16, player.y + 16, 'star'));
});

// Blueprint Shelf Selection
document.querySelectorAll('.blueprint-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.blueprint-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedBlueprint = btn.getAttribute('data-type');
    sfx.playJump();
  });
});

// Keyboard Controls (for PC Testing)
window.addEventListener('keydown', (e) => {
  sfx.init();
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.jump = true;
  if (e.code === 'KeyF' || e.code === 'Enter') triggerSlash();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.jump = false;
});
</script>
