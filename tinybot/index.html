<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TinyBot Coding Adventure</title>
<style>
  :root {
    --bg: #6C5CE7;
    --card: #FFFFFF;
    --accent: #FD79A8;
    --btn-up: #00CEC9;
    --btn-down: #0984E3;
    --btn-left: #FDCB6E;
    --btn-right: #E17055;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    background: linear-gradient(135deg, #A29BFE, var(--bg));
    font-family: 'Comic Sans MS', 'Fredoka', 'Nunito', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #game-container {
    background: var(--card);
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 400px;
    width: 100%;
  }
  /* Top Banner */
  .title-bar {
    text-align: center;
    margin-bottom: 12px;
  }
  .title-bar h1 {
    font-size: 26px;
    color: #2D3436;
    letter-spacing: 1px;
  }
  .cookie-counter {
    font-size: 20px;
    font-weight: bold;
    color: #D63031;
    margin-top: 4px;
  }

  /* 4x4 Grid Board */
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    background: #DFE6E9;
    padding: 8px;
    border-radius: 18px;
    width: 280px;
    height: 280px;
    margin-bottom: 18px;
    position: relative;
  }
  .tile {
    background: #FFFFFF;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    box-shadow: 0 4px 0 #B2BEC3;
    transition: transform 0.15s ease;
  }
  /* TinyBot Character */
  .bot {
    display: inline-block;
    font-size: 44px;
    animation: botIdle 1.5s ease-in-out infinite alternate;
  }
  @keyframes botIdle {
    0% { transform: translateY(0px) rotate(0deg); }
    100% { transform: translateY(-4px) rotate(2deg); }
  }
  .bot-hop {
    animation: hop 0.25s ease-out;
  }
  @keyframes hop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3) translateY(-10px); }
    100% { transform: scale(1); }
  }

  /* Giant Toddler Touch Controls */
  #controller {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 290px;
  }
  .cmd-btn {
    height: 72px;
    border-radius: 20px;
    border: none;
    font-size: 32px;
    color: #FFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .cmd-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .cmd-btn span {
    font-size: 13px;
    font-weight: 900;
    margin-top: -2px;
    letter-spacing: 0.5px;
  }
  #btn-up    { grid-column: 2; grid-row: 1; background: var(--btn-up); }
  #btn-left  { grid-column: 1; grid-row: 2; background: var(--btn-left); }
  #btn-down  { grid-column: 2; grid-row: 2; background: var(--btn-down); }
  #btn-right { grid-column: 3; grid-row: 2; background: var(--btn-right); }

  /* Celebration Confetti Overlay */
  #celebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99;
  }
  .star-pop {
    position: absolute;
    font-size: 40px;
    animation: popOut 0.8s ease-out forwards;
  }
  @keyframes popOut {
    0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="title-bar">
    <h1>🤖 TinyBot!</h1>
    <div class="cookie-counter">Cookies: <span id="cookie-count">0</span> ⭐</div>
  </div>

  <!-- The 4x4 Coding Grid -->
  <div id="grid"></div>

  <!-- Big Colorful Commands -->
  <div id="controller">
    <button class="cmd-btn" id="btn-up" onclick="sendCode('UP')">⬆️<span>UP</span></button>
    <button class="cmd-btn" id="btn-left" onclick="sendCode('LEFT')">⬅️<span>LEFT</span></button>
    <button class="cmd-btn" id="btn-down" onclick="sendCode('DOWN')">⬇️<span>DOWN</span></button>
    <button class="cmd-btn" id="btn-right" onclick="sendCode('RIGHT')">➡️<span>RIGHT</span></button>
  </div>
</div>

<div id="celebration"></div>

<script>
// Web Audio Synthesizer (Zero External Dependencies)
class ToddlerAudio {
  constructor() {
    this.ctx = null;
    this.notes = { UP: 440, DOWN: 330, LEFT: 392, RIGHT: 493.88 }; // A, E, G, B
  }
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playStep(dir) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(this.notes[dir] || 440, now);
    osc.frequency.exponentialRampToValueAtTime(this.notes[dir] * 1.25, now + 0.12);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }
  playNomNom() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.06);
      gain.gain.setValueAtTime(0.3, now + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.06);
      osc.stop(now + idx * 0.06 + 0.19);
    });
  }
  playBump() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(80, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }
}

const audio = new ToddlerAudio();

// Game State
const GRID_SIZE = 4;
let botX = 0;
let botY = 0;
let cookieX = 2;
let cookieY = 2;
let score = 0;

const gridEl = document.getElementById('grid');
const celebrationEl = document.getElementById('celebration');

function buildGrid() {
  gridEl.innerHTML = '';
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${c}-${r}`;
      
      if (c === botX && r === botY) {
        tile.innerHTML = `<span class="bot" id="tinybot">🤖</span>`;
      } else if (c === cookieX && r === cookieY) {
        tile.innerHTML = `🍪`;
      }
      gridEl.appendChild(tile);
    }
  }
}

function spawnCookie() {
  let nx, ny;
  do {
    nx = Math.floor(Math.random() * GRID_SIZE);
    ny = Math.floor(Math.random() * GRID_SIZE);
  } while (nx === botX && ny === botY);
  cookieX = nx;
  cookieY = ny;
}

// Toddler Code Execution
function sendCode(command) {
  audio.init();

  let nextX = botX;
  let nextY = botY;

  if (command === 'UP') nextY--;
  if (command === 'DOWN') nextY++;
  if (command === 'LEFT') nextX--;
  if (command === 'RIGHT') nextX++;

  // Wall bounce (safe, no failure)
  if (nextX < 0 || nextX >= GRID_SIZE || nextY < 0 || nextY >= GRID_SIZE) {
    audio.playBump();
    const bot = document.getElementById('tinybot');
    if (bot) {
      bot.style.transform = 'scale(0.8) rotate(15deg)';
      setTimeout(() => bot.style.transform = '', 150);
    }
    return;
  }

  // Valid move
  botX = nextX;
  botY = nextY;
  audio.playStep(command);
  buildGrid();

  // Check Goal (Eat the cookie)
  if (botX === cookieX && botY === cookieY) {
    score++;
    document.getElementById('cookie-count').textContent = score;
    audio.playNomNom();
    burstConfetti();
    spawnCookie();
    setTimeout(buildGrid, 250);
  }
}

// Visual Confetti Burst
function burstConfetti() {
  const emojis = ['⭐', '🍪', '✨', '🎉', '💖'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'star-pop';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = '50%';
    p.style.top = '50%';
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 150 + 60;
    p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
    celebrationEl.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

// Start Game
buildGrid();
</script>
</body>
</html>
